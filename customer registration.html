<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>customer registration</title>
</head>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
  integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

<body>
  <form class="mx-5">
    <div class="mb-3">
      <label for="exampleInputEmail1" class="form-label">Email address</label>
      <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
      <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div>
    </div>
    <div class="mb-3">
      <label for="exampleInputPassword1" class="form-label">Password</label>
      <input type="password" class="form-control" id="exampleInputPassword1">
    </div>
    <div class="mb-3">
      <label for="examplewritenumberplate" class="form-label">Number Plate</label>
      <input type="alphanumeric" class="form-control" id="examplewritenumberplate" aria-describedby="emailHelp">
    </div>
    <div class="mb-3">
      <label for="exampledescribetheproblem" class="form-label">Email address</label>
      <input type="email" class="form-control" id="exampledescribetheproblem" aria-describedby="emailHelp">
    </div>
    <div class="mb-3 form-check">
      <input type="checkbox" class="form-check-input" id="exampleCheck1">
      <label class="form-check-label" for="exampleCheck1">Confirmation</label>
    </div>
    <button type="submit" class="btn btn-primary">Submit</button>
  </form>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8//js/bootstrap.bundle.min.js"
  integrity="dFKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXKistsha384-/BmnVDxM+D2scQbITxI"
  crossorigin="anonymous"></script>

</html>
